[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "upscale-video"
version = "0.2.0"
description = "Local, quality-first video upscaling pipeline for CUDA GPUs"
requires-python = ">=3.12,<3.13"
dependencies = [
    "textual>=0.70.0",
    "psutil>=7.0.0",
]

[project.scripts]
upscale-video = "upscaler.cli:main"

[tool.setuptools.packages.find]
include = ["upscaler*"]

