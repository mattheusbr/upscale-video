[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "upscale-video"
version = "0.1.0"
description = "Local, quality-first video upscaling pipeline for CUDA GPUs"
requires-python = ">=3.12,<3.13"
dependencies = []

[project.scripts]
upscale-video = "upscaler.cli:main"

[tool.setuptools.packages.find]
include = ["upscaler*"]

